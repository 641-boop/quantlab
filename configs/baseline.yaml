# QuantLab baseline experiment config.
# Run with:  uv run python examples/run_research.py --config configs/baseline.yaml

data:
  universe: "000300"        # 沪深300成分股；也可写成逗号分隔的代码列表，如 "600519,000858"
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  data_dir: "data"          # 本地 parquet 缓存目录
  adjust: "hfq"             # 后复权

factors:
  names:
    - momentum_20
    - momentum_60
    - reversal_5
    - volatility_20
    - volume_ratio_20
    - turnover_20
    - corr_cv_20
    - beta_oc_20
    - rsi_14
    - macd
    - rsv_20
    - cntp_20
    - sump_20
    - kbar_kmid
    - kbar_klen
    - wvma_20
  normalize: "zscore"       # zscore / rank / scale / robust_zscore / none
  neutralize: false         # 是否对目标列做横截面中性化（需面板含对应列）
  neutralize_targets:
    - market_cap

model:
  name: "lgbm"              # lgbm / mlp / transformer
  label_horizon: 1          # 标签：未来1日收益
  train_end: null           # 缺省按 60% 分位
  valid_end: null           # 缺省按 80% 分位
  params:
    learning_rate: 0.05
    num_leaves: 63
    colsample_bytree: 0.8
    subsample: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.5

backtest:
  strategy: "topk"          # topk / neutral
  top_k: 0.2                # 每日持有预测前 20% 的股票，等权
  init_cash: 100000000      # 1 亿
  commission_rate: 0.00025
  min_commission: 5.0
  stamp_tax: 0.001
  transfer_fee: 0.00001
  slippage: 0.0005
  risk_degree: 0.95
  max_position_weight: 1.0
  benchmark: "equal"        # 等权基准

report:
  output_dir: "reports"     # 报告写入 reports/<timestamp>/
