[project]
name = "quantlab"
version = "0.1.0"
description = "A modern A-share quantitative research platform: data, factors, models and backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantLab" }]
keywords = ["quant", "factor", "backtest", "alpha", "a-share"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "akshare>=1.13",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
# ARM 设备 / 老 CPU（不支持 AVX2）上 Polars 会报 "Missing required CPU features" 并直接崩溃，
# 加装官方兼容运行时即可解决：uv sync --extra rtcompat
rtcompat = ["polars[rtcompat]>=0.20"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.8",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
