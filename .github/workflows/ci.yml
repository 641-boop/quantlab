name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Offline demo (synthetic)
        run: |
          uv run python examples/make_synthetic.py --n-stocks 40
          uv run python examples/run_research.py --config configs/synthetic.yaml

      - name: Upload demo report
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/
          retention-days: 14
